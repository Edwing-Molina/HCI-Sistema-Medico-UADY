name: Auto PR & Project Sync

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create PR and Link Issue
        env:
          GH_TOKEN: ${{ secrets.MY_PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 1. Buscar el issue más antiguo en "In Progress" asignado a ti
          ISSUE_DATA=$(gh issue list --assignee "$OWNER" --state open --json number,title --jq '.[0]')
          ISSUE_ID=$(echo $ISSUE_DATA | jq -r '.number')
          
          if [ -z "$ISSUE_ID" ] || [ "$ISSUE_ID" == "null" ]; then
            echo "No hay issues para vincular."
            exit 0
          fi

          # 2. Crear la PR vinculada (Esto prepara el paso a DONE al mergear)
          gh pr create \
            --title "Fix #$ISSUE_ID: $(echo $ISSUE_DATA | jq -r '.title')" \
            --body "Closes #$ISSUE_ID. \n\nGenerado automáticamente para el proyecto UADY." \
            --base main \
            --head "${{ github.ref_name }}" \
            --assignee "$OWNER" \
            --label "automated-pr"
