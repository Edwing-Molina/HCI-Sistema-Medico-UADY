name: Auto PR & Project Sync

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create PR and Link Issue
        env:
          GH_TOKEN: ${{ secrets.MY_PROJECT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # 1. Buscar el issue más antiguo (número más bajo) asignado a ti y abierto
          # --sort created y --direction asc garantizan que el #1 salga antes que el #20
          ISSUE_DATA=$(gh issue list --assignee "$OWNER" --state open --sort created --direction asc --limit 1 --json number,title --jq '.[0]')
          
          ISSUE_ID=$(echo $ISSUE_DATA | jq -r '.number')
          ISSUE_TITLE=$(echo $ISSUE_DATA | jq -r '.title')

          if [ "$ISSUE_ID" == "null" ] || [ -z "$ISSUE_ID" ]; then
            echo "No se encontraron issues asignados. Creando PR genérica."
            TITLE="Sync: ${{ github.ref_name }} to main"
            BODY="PR automática sin issue vinculado."
          else
            echo "Trabajando en el Issue más antiguo encontrado: #$ISSUE_ID"
            TITLE="Fix #$ISSUE_ID: $ISSUE_TITLE"
            # 'Closes #ID' es lo que hace que se mueva a DONE al mergear
            BODY="Este PR resuelve el issue #$ISSUE_ID. \n\nGenerado para el proyecto UADY."
          fi

          # 2. Crear la PR si no existe
          PR_EXISTS=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')

          if [ -z "$PR_EXISTS" ]; then
            gh pr create \
              --title "$TITLE" \
              --body "$BODY" \
              --base main \
              --head "${{ github.ref_name }}" \
              --assignee "$OWNER" \
              --label "automated-pr"
          else
            echo "La PR para esta rama ya existe (#$PR_EXISTS)."
          fi
